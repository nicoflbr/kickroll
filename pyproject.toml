[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kickroll"
version = "0.1.3"
description = "Deterministic orchestrator for Claude Code workers (claude -p) with test-driven retries; Jev routing optional."
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
jev = ["typesafe-sdk"]

[project.scripts]
kickroll = "kickroll.cli:main"

[tool.setuptools]
packages = ["kickroll"]
